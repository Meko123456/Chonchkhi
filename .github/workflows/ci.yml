name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Spotless format check
        run: ./gradlew spotlessCheck --stacktrace

      - name: detekt static analysis
        run: ./gradlew detekt --stacktrace

      - name: Build, lint and unit tests
        run: ./gradlew :app:assembleDebug :app:lintDebug :core:testDebugUnitTest --stacktrace

      # Debug builds never run R8, so shrinking breakage stayed invisible until release day.
      # This is also the only job that proves the committed baseline profile still packages.
      - name: Release build (R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
