name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Spotless format check
        run: ./gradlew spotlessCheck --stacktrace

      - name: detekt static analysis
        run: ./gradlew detekt --stacktrace

      # `testDebugUnitTest`, not `:core:testDebugUnitTest`. :core is the only module with tests
      # today, so naming it looked equivalent - but it silently excludes :app and :feature-home,
      # which means the first test written in either would never run. Confirmed: a deliberately
      # failing test in :app passes `:core:testDebugUnitTest` and fails this.
      - name: Build, lint and unit tests
        run: ./gradlew :app:assembleDebug :app:lintDebug testDebugUnitTest --stacktrace

      # Nothing above reaches :baselineprofile. The profile generator is instrumentation code, and
      # actually generating a profile needs an emulator this workflow does not have — but compiling
      # and packaging its APK does not, and that is where the rot would show: a renamed screen, a
      # dropped uiautomator or macrobenchmark API, a broken targetProjectPath. nonMinifiedRelease is
      # the variant generateBaselineProfile drives, and assembling it needs no :app tasks at all.
      - name: Compile the baseline profile module
        run: ./gradlew :baselineprofile:assembleNonMinifiedRelease --stacktrace

      # Debug builds never run R8, so shrinking breakage stayed invisible until release day.
      # This is also the only job that proves the committed baseline profile still packages.
      #
      # lintVitalRelease is the release variant's lint, and the check AGP itself runs when you
      # build a real release; every other app in the fleet gates on it and this one did not.
      # Honest note: no case was found where it fires and the lintDebug above stays quiet, so it
      # is defence in depth against release-only sources and manifest merges, not a known hole.
      - name: Release build (R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  release-launches:
    # Building the release proves R8 ran, not that the result starts. On 30 September 2026 three
    # apps in this collection turned out to have minified builds that died before their first frame
    # (R8 full mode had stripped a constructor a library reaches for by reflection), and every check
    # was green. This installs the R8 build on an emulator, opens it, and fails if it crashes or is
    # not running fifteen seconds later. Proven both ways in Nabiji #13.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # CI has no release key, so the build comes out unsigned. Any key will do for installing it
      # on a throwaway emulator, so this makes one up.
      - name: Build the minified release and sign it with a throwaway key
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          keytool -genkeypair -keystore "$RUNNER_TEMP/launch.jks" -storepass launchcheck \
            -keypass launchcheck -alias launch -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=release launch check"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$(ls app/build/outputs/apk/release/*.apk | head -1)" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/launch.jks" --ks-pass pass:launchcheck \
            --key-pass pass:launchcheck --out "$RUNNER_TEMP/release.apk" "$RUNNER_TEMP/aligned.apk"

      # The emulator wants more disk than ubuntu-latest leaves free, and it needs KVM.
      - name: Free disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the release build on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/launch-release.sh ${{ runner.temp }}/release.apk
